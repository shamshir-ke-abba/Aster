# Aster — Gradle properties

# AndroidX — required for all modern Android/Compose dependencies
android.useAndroidX=true

# Kotlin code style — official (not obsolete)
kotlin.code.style=official

# Enable non-transitive R classes for faster builds and correctness
android.nonTransitiveRClass=true

# Enable configuration cache (Gradle 8.x stable)
org.gradle.configuration-cache=true

# Parallel project execution
org.gradle.parallel=true

# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Suppress known Gradle 9 deprecation warnings from AGP 8.7 (non-actionable from project side)
# These come from AGP internals and will be resolved in a future AGP release.
org.gradle.warning.mode=none
